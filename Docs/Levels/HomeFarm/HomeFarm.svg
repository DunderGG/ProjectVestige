<text class="n" x="900" y="399">Bed: indoors</text>
<text class="n" x="900" y="420">No exit until the town</text>
<text class="l" x="900" y="455">Key</text>
<text class="n" x="900" y="476">route, 2 m wide min.</text>
<text class="n" x="900" y="497">field apron, kept clear</text>
