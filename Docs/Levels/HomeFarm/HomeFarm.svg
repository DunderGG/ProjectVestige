<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="780" viewBox="0 0 1160 780" role="img" aria-labelledby="t d">
<title id="t">Home farm layout, top-down</title>
<desc id="d">Top-down sketch of L_Farm for the vertical slice, north up, east = +X: the 8 by 8 field in the middle; the farmhouse with the bed inside to the west, on the clean side; Hob's spot by its door and the Player Start south-east of it; the service yard to the east, on the heavy side, with the well, the shipping bin and the seed dispensers in a north-south line; a reserved dirty water spot north-east of the field, nearer than the well; and a blocking boundary round about 50 by 35 metres. Drawn to the plan's targets at 16 pixels per metre; the map is the measurement.</desc>
