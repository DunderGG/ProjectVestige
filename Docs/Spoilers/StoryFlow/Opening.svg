<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1210" viewBox="0 0 1500 1210" role="img" aria-labelledby="title description">
	<title id="title">Opening story flow</title>
	<desc id="description">The six drafted opening scenes focus on waking, making the farm viable, learning Wellspring's routines and choosing a home before the wider truths of the world. Family traces are a parallel emotional thread, not an immediate conspiracy reveal; the opening is about survival, care and ordinary responsibility, not lore-dump suspicion.</desc>
	<defs>
		<marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
			<path d="M 0 0 L 10 5 L 0 10 z" fill="#435466"/>
		</marker>
		<marker id="arrow-dashed" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
			<path d="M 0 0 L 10 5 L 0 10 z" fill="#738397"/>
		</marker>
		<style>
			.background { fill: #f7f8fa; }
			.main { fill: #c7def2; stroke: #34495e; stroke-width: 2; }
			.side { fill: #ffffff; stroke: #8998a8; stroke-width: 2; }
			.summary { fill: #eceff2; stroke: #8998a8; stroke-width: 2; }
			.path { fill: none; stroke: #435466; stroke-width: 3; marker-end: url(#arrow); }
			.branch { fill: none; stroke: #738397; stroke-width: 2.5; stroke-dasharray: 8 7; marker-end: url(#arrow-dashed); }
			.trunk { fill: none; stroke: #435466; stroke-width: 3; }
			.title { fill: #203040; font: 700 16px "Segoe UI", Arial, sans-serif; letter-spacing: 1px; }
			.copy { fill: #263746; font: 15px "Segoe UI", Arial, sans-serif; }
			.small { fill: #526273; font: 14px "Segoe UI", Arial, sans-serif; }
			.label-bg { fill: #f7f8fa; }
			.label { fill: #526273; font: italic 13px "Segoe UI", Arial, sans-serif; }
			.nav-link { fill: #165d9c; font: 14px "Segoe UI", Arial, sans-serif; text-decoration: underline; cursor: pointer; }
		</style>
	</defs>

	<rect class="background" width="1500" height="1210"/>
	<text class="small" x="50" y="34">Drafted scenes O-01 to O-06 · pacing overview, not a quest prerequisite map</text>

	<path class="path" d="M 750 150 V 190"/>
	<path class="path" d="M 750 300 V 340"/>
	<path class="path" d="M 750 450 V 490"/>
	<path class="path" d="M 750 600 V 665"/>
	<path class="branch" d="M 520 250 H 400"/>
	<path class="branch" d="M 400 305 C 470 360 470 710 520 735"/>
	<path class="trunk" d="M 750 600 V 735"/>
	<path class="path" d="M 750 735 V 790"/>

	<rect class="main" x="520" y="50" width="460" height="100" rx="12"/>
	<text text-anchor="middle" x="750" y="86">
		<tspan class="title">O-01 · WAKING</tspan>
		<tspan class="copy" x="750" dy="28">The pod failed; Hob explains the Four Days</tspan>
		<tspan class="copy" x="750" dy="21">Player may ask, pause or focus on immediate safety</tspan>
	</text>

	<rect class="main" x="520" y="190" width="460" height="110" rx="12"/>
	<text text-anchor="middle" x="750" y="226">
		<tspan class="title">O-02 · FIRST WORK</tspan>
		<tspan class="copy" x="750" dy="28">Start with the garden; Hob's order is fulfilled</tspan>
		<tspan class="copy" x="750" dy="21">Player chooses how to invite Hob's input</tspan>
	</text>

	<rect class="main" x="520" y="340" width="460" height="110" rx="12"/>
	<text text-anchor="middle" x="750" y="376">
		<tspan class="title">O-03 · WELLSPRING</tspan>
		<tspan class="copy" x="750" dy="28">Meet the town, administrator and pump operators</tspan>
		<tspan class="copy" x="750" dy="21">Operators own the machinery; assembly sets priorities</tspan>
	</text>

	<rect class="main" x="520" y="490" width="460" height="110" rx="12"/>
	<text text-anchor="middle" x="750" y="526">
		<tspan class="title">O-04 · PUMP HANDOFF GAP</tspan>
		<tspan class="copy" x="750" dy="28">A missed handoff creates a practical, believable problem</tspan>
		<tspan class="copy" x="750" dy="21">Operators may propose a shared log; the town decides</tspan>
	</text>

	<rect class="side" x="50" y="205" width="350" height="100" rx="12"/>
	<text text-anchor="middle" x="225" y="241">
		<tspan class="title">O-05 · FIRST FAMILY TRACE</tspan>
		<tspan class="copy" x="225" dy="28">An ordinary object; the parents' fate is still unknown to the player</tspan>
		<tspan class="copy" x="225" dy="21">Can surface during restoration; player may defer</tspan>
	</text>

	<rect class="main" x="520" y="665" width="460" height="140" rx="12"/>
	<text text-anchor="middle" x="750" y="701">
		<tspan class="title">O-06 · A HOME, NOT A MISSION</tspan>
		<tspan class="copy" x="750" dy="28">The sleeper can choose what to take on next</tspan>
		<tspan class="copy" x="750" dy="21">Hob decides whether to stay or join town recovery</tspan>
		<tspan class="copy" x="750" dy="21">Opening ends on curiosity, not a conspiracy reveal</tspan>
	</text>

	<rect class="summary" x="300" y="875" width="900" height="110" rx="12"/>
	<text text-anchor="middle" x="750" y="913">
		<tspan class="title">WHAT THIS PHASE ESTABLISHES</tspan>
		<tspan class="copy" x="750" dy="29">Time has passed · the farm is a home base · Wellspring depends on cooperation</tspan>
		<tspan class="copy" x="750" dy="22">No trial program is implied; the family trace does not solve the family's fate</tspan>
	</text>

	<line x1="515" y1="1040" x2="565" y2="1040" class="path"/>
	<text class="small" x="580" y="1045">opening progression</text>
	<line x1="800" y1="1040" x2="850" y2="1040" class="branch"/>
	<text class="small" x="865" y="1045">parallel or deferrable beat</text>

	<g>
		<text class="small" x="55" y="1090" font-weight="700">Legend</text>
		<rect x="170" y="1075" width="24" height="20" rx="4" class="main"/>
		<text class="small" x="203" y="1090">Opening progression</text>
		<rect x="485" y="1075" width="24" height="20" rx="4" class="side"/>
		<text class="small" x="518" y="1090">Supporting beat</text>
		<rect x="780" y="1075" width="24" height="20" rx="4" class="summary"/>
		<text class="small" x="813" y="1090">Phase takeaway</text>
		<line x1="340" y1="1125" x2="390" y2="1125" class="path"/>
		<text class="small" x="405" y="1130">Intended progression</text>
		<line x1="790" y1="1125" x2="840" y2="1125" class="branch"/>
		<text class="small" x="855" y="1130">Parallel or deferrable beat</text>
		<line x1="1190" y1="1115" x2="1190" y2="1135" class="trunk"/>
		<text class="small" x="1208" y="1130">Shared stem</text>
	</g>
	<g text-anchor="middle">
		<a href="Overview.svg"><text class="nav-link" x="150" y="1185">Overview</text></a>
		<a href="Early.svg"><text class="nav-link" x="390" y="1185">Next: Early</text></a>
		<a href="Family.svg"><text class="nav-link" x="650" y="1185">Parallel: Family thread</text></a>
	</g>
</svg>
