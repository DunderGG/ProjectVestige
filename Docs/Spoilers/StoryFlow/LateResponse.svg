<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="2070" viewBox="0 0 1800 2070" role="img" aria-labelledby="title description">
	<title id="title">Late response: consent-separated choices and parallel arcs</title>
	<desc id="description">After first contact, care, records, accountability and Wellspring disclosure proceed as separate lanes. Each depends on the relevant person's or community's choice. A follow-up occurs only if invited. Gage's aquifer overhaul and the nomad's route arc are parallel payoffs, not prerequisites for survivor care.</desc>
	<defs>
		<marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
			<path d="M 0 0 L 10 5 L 0 10 z" fill="#435466"/>
		</marker>
		<marker id="arrow-dashed" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
			<path d="M 0 0 L 10 5 L 0 10 z" fill="#738397"/>
		</marker>
		<style>
			.background { fill: #f7f8fa; }
			.lane { fill: #d7e0e8; stroke: #d3dae2; stroke-width: 1.5; }
			.card { fill: #ffffff; stroke: #8998a8; stroke-width: 2; }
			.optional { fill: #ffdf9e; stroke: #b28a38; stroke-width: 2; }
			.outcome { fill: #c7def2; stroke: #34495e; stroke-width: 2; }
			.open { fill: #dcc6ef; stroke: #8873a6; stroke-width: 2; }
			.path { fill: none; stroke: #435466; stroke-width: 3; marker-end: url(#arrow); }
			.branch { fill: none; stroke: #738397; stroke-width: 2.5; stroke-dasharray: 8 7; marker-end: url(#arrow-dashed); }
			.trunk { fill: none; stroke: #435466; stroke-width: 3; }
			.lane-title { fill: #34495e; font: 700 16px "Segoe UI", Arial, sans-serif; }
			.title { fill: #203040; font: 700 13px "Segoe UI", Arial, sans-serif; letter-spacing: .3px; }
			.copy { fill: #263746; font: 12px "Segoe UI", Arial, sans-serif; }
			.small { fill: #526273; font: 12px "Segoe UI", Arial, sans-serif; }
			.nav-link { fill: #165d9c; font: 14px "Segoe UI", Arial, sans-serif; text-decoration: underline; cursor: pointer; }
		</style>
	</defs>

	<rect class="background" width="1800" height="2070"/>
	<text class="small" x="35" y="30">R-01 to R-08 · after initial contact and immediate safety; independent choices, not a mandatory checklist</text>

	<rect class="outcome" x="465" y="55" width="870" height="100" rx="12"/>
	<text text-anchor="middle" x="900" y="91">
		<tspan class="title">BEGIN WITH WHAT THE AFFECTED PERSON WANTS</tspan>
		<tspan class="copy" x="900" dy="25">“No,” “not now,” changing their mind, and no further contact are valid outcomes</tspan>
		<tspan class="copy" x="900" dy="19">Care ≠ testimony ≠ recordkeeping ≠ disclosure ≠ accountability</tspan>
	</text>
	<path class="trunk" d="M 900 155 V 195"/>
	<path class="trunk" d="M 235 195 H 1565"/>
	<path class="branch" d="M 235 195 V 230"/>
	<path class="branch" d="M 680 195 V 230"/>
	<path class="branch" d="M 1120 195 V 230"/>
	<path class="branch" d="M 1565 195 V 230"/>

	<rect class="lane" x="25" y="230" width="420" height="1110" rx="14"/>
	<text class="lane-title" x="45" y="262">1 · Care and safety</text>
	<rect class="card" x="45" y="285" width="380" height="130" rx="10"/>
	<text text-anchor="middle" x="235" y="318">
		<tspan class="title">R-01 · ASK, DON'T GUESS</tspan>
		<tspan class="copy" x="235" dy="24">Survivor may request equipment-only care;</tspan>
		<tspan class="copy" x="235" dy="19">no body examination or questions</tspan>
		<tspan class="copy" x="235" dy="19">Ask whether player should stay</tspan>
	</text>
	<path class="branch" d="M 235 415 V 455"/>
	<rect class="optional" x="45" y="455" width="380" height="155" rx="10"/>
	<text text-anchor="middle" x="235" y="489">
		<tspan class="title">ONLY THE CHOSEN HELP</tspan>
		<tspan class="copy" x="235" dy="24">Arrange requested equipment help, with limits</tspan>
		<tspan class="copy" x="235" dy="19">Offer privacy; do not send another person</tspan>
		<tspan class="copy" x="235" dy="19">Offer a quieter room to inspect, not assume</tspan>
		<tspan class="copy" x="235" dy="19">they want to stay there</tspan>
	</text>
	<path class="path" d="M 235 610 V 650"/>
	<rect class="card" x="45" y="650" width="380" height="145" rx="10"/>
	<text text-anchor="middle" x="235" y="685">
		<tspan class="title">THEY SET CONTACT TERMS</tspan>
		<tspan class="copy" x="235" dy="24">Wait outside, leave, or stay only if invited</tspan>
		<tspan class="copy" x="235" dy="19">No check-in if they asked for no contact</tspan>
		<tspan class="copy" x="235" dy="19">Do not route around a refusal through allies</tspan>
	</text>
	<rect class="open" x="45" y="840" width="380" height="145" rx="10"/>
	<text text-anchor="middle" x="235" y="875">
		<tspan class="title">CARE CAN STOP HERE</tspan>
		<tspan class="copy" x="235" dy="24">No testimony or record required</tspan>
		<tspan class="copy" x="235" dy="19">to offer support or believe the broad truth</tspan>
		<tspan class="copy" x="235" dy="19">A request may change later</tspan>
	</text>

	<rect class="lane" x="465" y="230" width="430" height="1110" rx="14"/>
	<text class="lane-title" x="485" y="262">2 · Records and testimony</text>
	<rect class="card" x="485" y="285" width="390" height="145" rx="10"/>
	<text text-anchor="middle" x="680" y="319">
		<tspan class="title">R-02 · CHOOSE WHETHER TO SPEAK</tspan>
		<tspan class="copy" x="680" dy="24">Talk without a record</tspan>
		<tspan class="copy" x="680" dy="19">Approve a transcript · or stop today</tspan>
		<tspan class="copy" x="680" dy="19">Choose who may be present</tspan>
	</text>
	<path class="branch" d="M 680 430 V 470"/>
	<text class="small" x="700" y="455">if transcript is chosen</text>
	<rect class="optional" x="485" y="470" width="390" height="150" rx="10"/>
	<text text-anchor="middle" x="680" y="505">
		<tspan class="title">ONLY IF TRANSCRIPT IS CHOSEN</tspan>
		<tspan class="copy" x="680" dy="24">Survivor defines exact scope and exclusions</tspan>
		<tspan class="copy" x="680" dy="19">Survivor reviews what Cleo will keep</tspan>
		<tspan class="copy" x="680" dy="19">No gap is filled in by inference</tspan>
	</text>
	<path class="branch" d="M 680 620 V 660"/>
	<rect class="card" x="485" y="660" width="390" height="170" rx="10"/>
	<text text-anchor="middle" x="680" y="695">
		<tspan class="title">ARCHIVE PERMISSION IS A NEW CHOICE</tspan>
		<tspan class="copy" x="680" dy="24">Keep record private</tspan>
		<tspan class="copy" x="680" dy="19">Share only an approved, possibly redacted excerpt</tspan>
		<tspan class="copy" x="680" dy="19">Withdraw permission; remove Cleo's copy</tspan>
		<tspan class="copy" x="680" dy="19">Nothing is sent without asking again</tspan>
	</text>
	<rect class="open" x="485" y="875" width="390" height="145" rx="10"/>
	<text text-anchor="middle" x="680" y="910">
		<tspan class="title">PRIVATE ACCOUNT ≠ PUBLIC TESTIMONY</tspan>
		<tspan class="copy" x="680" dy="24">Permission to speak does not grant permission</tspan>
		<tspan class="copy" x="680" dy="19">to record, retain, archive or disclose</tspan>
		<tspan class="copy" x="680" dy="19">Each needs its own agreement</tspan>
	</text>

	<rect class="lane" x="915" y="230" width="410" height="1110" rx="14"/>
	<text class="lane-title" x="935" y="262">3 · Investigation and accountability</text>
	<rect class="card" x="935" y="285" width="370" height="145" rx="10"/>
	<text text-anchor="middle" x="1120" y="319">
		<tspan class="title">R-03 · CORROBORATE A SPECIFIC LEAD</tspan>
		<tspan class="copy" x="1120" dy="24">One order plus another log links a person</tspan>
		<tspan class="copy" x="1120" dy="19">to a procedure; it does not prove all they knew</tspan>
		<tspan class="copy" x="1120" dy="19">No accusation from rank or membership alone</tspan>
	</text>
	<path class="branch" d="M 1120 430 V 470"/>
	<rect class="card" x="935" y="470" width="370" height="185" rx="10"/>
	<text text-anchor="middle" x="1120" y="505">
		<tspan class="title">ASK THE SURVIVOR WHAT THEY WANT</tspan>
		<tspan class="copy" x="1120" dy="24">They need not meet or confront anyone</tspan>
		<tspan class="copy" x="1120" dy="19">They may want records retained and safeguards</tspan>
		<tspan class="copy" x="1120" dy="19">They may not want their identity used</tspan>
		<tspan class="copy" x="1120" dy="19">Their request shapes what happens next</tspan>
	</text>
	<path class="branch" d="M 1120 655 V 695"/>
	<rect class="optional" x="935" y="695" width="370" height="190" rx="10"/>
	<text text-anchor="middle" x="1120" y="730">
		<tspan class="title">R-04 · POSSIBLE RESPONSES</tspan>
		<tspan class="copy" x="1120" dy="24">Private review: report evidence without their name</tspan>
		<tspan class="copy" x="1120" dy="19">Public release asked about: “not today”;</tspan>
		<tspan class="copy" x="1120" dy="19">do not raise it again unless they do</tspan>
		<tspan class="copy" x="1120" dy="19">Pause: preserve records; no report or contact</tspan>
	</text>
	<rect class="open" x="935" y="920" width="370" height="145" rx="10"/>
	<text text-anchor="middle" x="1120" y="955">
		<tspan class="title">NO PROMISED VERDICT</tspan>
		<tspan class="copy" x="1120" dy="24">Review outcome remains uncertain</tspan>
		<tspan class="copy" x="1120" dy="19">Accountability can remain unfinished</tspan>
		<tspan class="copy" x="1120" dy="19">without making survivor care conditional</tspan>
	</text>

	<rect class="lane" x="1345" y="230" width="430" height="1110" rx="14"/>
	<text class="lane-title" x="1365" y="262">4 · Wellspring disclosure</text>
	<rect class="card" x="1365" y="285" width="390" height="145" rx="10"/>
	<text text-anchor="middle" x="1560" y="319">
		<tspan class="title">R-05 · ASSEMBLY CONSIDERS RISK</tspan>
		<tspan class="copy" x="1560" dy="24">The town chooses what it shares</tspan>
		<tspan class="copy" x="1560" dy="19">The sleeper does not speak for Wellspring</tspan>
		<tspan class="copy" x="1560" dy="19">The town cannot decide what the survivor shares</tspan>
	</text>
	<path class="branch" d="M 1560 430 V 470"/>
	<rect class="optional" x="1365" y="470" width="390" height="190" rx="10"/>
	<text text-anchor="middle" x="1560" y="505">
		<tspan class="title">ASSEMBLY'S OPTIONS REMAIN OPEN</tspan>
		<tspan class="copy" x="1560" dy="24">Limited report of institute evidence</tspan>
		<tspan class="copy" x="1560" dy="19">Pause until there is a safety plan</tspan>
		<tspan class="copy" x="1560" dy="19">Another decision by the assembly</tspan>
		<tspan class="copy" x="1560" dy="19">Player advice is not the town's decision</tspan>
	</text>
	<rect class="open" x="1365" y="695" width="390" height="155" rx="10"/>
	<text text-anchor="middle" x="1560" y="730">
		<tspan class="title">KEEP RECORDS SEPARATE</tspan>
		<tspan class="copy" x="1560" dy="24">Institute evidence need not expose</tspan>
		<tspan class="copy" x="1560" dy="19">Wellspring's cistern map or reserve stock</tspan>
		<tspan class="copy" x="1560" dy="19">Survivor identity is not part of town proposal</tspan>
	</text>

	<rect class="lane" x="25" y="1370" width="1750" height="325" rx="14"/>
	<text class="lane-title" x="45" y="1403">5 · Follow-up and parallel character payoffs</text>
	<rect class="card" x="55" y="1430" width="500" height="175" rx="10"/>
	<text text-anchor="middle" x="305" y="1466">
		<tspan class="title">R-06 · CHECK-IN ONLY IF AUTHORIZED</tspan>
		<tspan class="copy" x="305" dy="25">If the survivor says “not today,” ask whether they</tspan>
		<tspan class="copy" x="305" dy="19">will raise it or want a later check-in</tspan>
		<tspan class="copy" x="305" dy="19">If they choose to raise it themselves, no later contact</tspan>
		<tspan class="copy" x="305" dy="19">If they asked for no contact, do not use this scene</tspan>
	</text>
	<rect class="optional" x="650" y="1430" width="500" height="175" rx="10"/>
	<text text-anchor="middle" x="900" y="1466">
		<tspan class="title">R-07 · NOMAD'S ROUTE CONTINUES BY CHOICE</tspan>
		<tspan class="copy" x="900" dy="25">Agreed stops may share limited supplies and warnings</tspan>
		<tspan class="copy" x="900" dy="19">No names or route book; agree on limits and review</tspan>
		<tspan class="copy" x="900" dy="19">The farm may decline; the nomad remains free to travel</tspan>
	</text>
	<rect class="optional" x="1245" y="1430" width="500" height="175" rx="10"/>
	<text text-anchor="middle" x="1495" y="1466">
		<tspan class="title">R-08 · GAGE'S HIGH-TRUST AQUIFER OVERHAUL</tspan>
		<tspan class="copy" x="1495" dy="25">Operators control the work and clear the line</tspan>
		<tspan class="copy" x="1495" dy="19">Earlier pressure-test consequences stay in the report</tspan>
		<tspan class="copy" x="1495" dy="19">A character payoff, not a survivor-response prerequisite</tspan>
	</text>
	<text class="small" x="900" y="1650" text-anchor="middle">These arcs can overlap the response; none is a prerequisite for care, privacy or accountability.</text>

	<rect class="outcome" x="230" y="1730" width="1340" height="120" rx="12"/>
	<text text-anchor="middle" x="900" y="1766">
		<tspan class="title">AFTERMATH · AN UNFINISHED, POSSIBLY MIXED OUTCOME</tspan>
		<tspan class="copy" x="900" dy="25">One person may accept support; another may choose privacy; records may be partly preserved; a review may remain open</tspan>
		<tspan class="copy" x="900" dy="19">No single apology, confrontation or institutional reform resolves every harm</tspan>
	</text>

	<line x1="615" y1="1900" x2="665" y2="1900" class="path"/>
	<text class="small" x="680" y="1905">progression within a response lane</text>
	<line x1="1020" y1="1900" x2="1070" y2="1900" class="branch"/>
	<text class="small" x="1085" y="1905">conditional / separate arc</text>
	<line x1="1435" y1="1890" x2="1435" y2="1910" class="trunk"/>
	<text class="small" x="1453" y="1905">Shared stem</text>

	<g>
		<text class="small" x="35" y="1965" font-weight="700">Legend</text>
		<rect x="55" y="1950" width="24" height="20" rx="4" class="lane"/>
		<text class="small" x="88" y="1965">Lane grouping</text>
		<rect x="345" y="1950" width="24" height="20" rx="4" class="card"/>
		<text class="small" x="378" y="1965">Response beat</text>
		<rect x="650" y="1950" width="24" height="20" rx="4" class="optional"/>
		<text class="small" x="683" y="1965">Conditional choice</text>
		<rect x="970" y="1950" width="24" height="20" rx="4" class="open"/>
		<text class="small" x="1003" y="1965">Boundary / open question</text>
		<rect x="1370" y="1950" width="24" height="20" rx="4" class="outcome"/>
		<text class="small" x="1403" y="1965">Possible mixed outcome</text>
	</g>
	<g text-anchor="middle">
		<a href="Overview.svg"><text class="nav-link" x="500" y="2025">Overview</text></a>
		<a href="Middle.svg"><text class="nav-link" x="740" y="2025">Previous: Middle</text></a>
		<a href="Family.svg"><text class="nav-link" x="980" y="2025">Parallel: Family thread</text></a>
	</g>
</svg>
