; Project Vestige's changes to the engine's scalability levels (Engine/Config/BaseScalability.ini).
; The target PC holds the frame budget at High; expensive features are Epic-only options (Docs/Architecture.md, section 10).

; Volumetric clouds: the engine doesn't scale them, so they cost the same at every level. Below Epic, fewer samples
; per pixel along the view ray (the engine's 96) and toward the sun (its 10). The edges get slightly grainier; the
; clouds' shape and colour stay. Measured 2026-11-04 on the benchmark field: 0.83 ms at Epic, 0.31 at High,
; 0.20 at Medium, 0.16 at Low. They sit with the sky atmosphere in the effects group.
; Epic and Cinematic name the engine's defaults: a level only sets the variables it lists, so without them a switch
; from Low to Epic would keep Low's caps.
[EffectsQuality@0]
r.VolumetricCloud.ViewRaySampleMaxCount=24
r.VolumetricCloud.Shadow.ViewRaySampleMaxCount=4

[EffectsQuality@1]
r.VolumetricCloud.ViewRaySampleMaxCount=32
r.VolumetricCloud.Shadow.ViewRaySampleMaxCount=4

[EffectsQuality@2]
r.VolumetricCloud.ViewRaySampleMaxCount=48
r.VolumetricCloud.Shadow.ViewRaySampleMaxCount=5

[EffectsQuality@3]
r.VolumetricCloud.ViewRaySampleMaxCount=768
r.VolumetricCloud.Shadow.ViewRaySampleMaxCount=80

[EffectsQuality@Cine]
r.VolumetricCloud.ViewRaySampleMaxCount=768
r.VolumetricCloud.Shadow.ViewRaySampleMaxCount=80
